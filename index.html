<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WisdomChat by GetSetAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --wc-bg: #1A1817;
      --wc-surface: #252220;
      --wc-line: #3A3532;
      --wc-fg: #F2EDE4;
      --wc-fg-dim: #8A8277;
      --wc-brass: #B8894F;
      --wc-brass-soft: #D4A876;
      --wc-ink: #0F3B3A;
      --brand: #7C3AED;
      
      --font-sans: 'Inter Tight', sans-serif;
      --font-serif: 'Fraunces', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      background-color: var(--wc-bg);
      background-image: radial-gradient(ellipse at top, rgba(184, 137, 79, 0.08), transparent 60%);
      color: var(--wc-fg);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--wc-surface);
      padding: 48px 40px;
      border-radius: 16px;
      border: 1px solid var(--wc-line);
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    
    .logo-icon svg {
      width: 56px;
      height: 56px;
    }

    h1 { 
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--wc-fg);
    }

    .sub-brand {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--wc-brass);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 500;
    }

    p.subtitle { 
      margin: 8px 0 32px; 
      color: var(--wc-fg-dim); 
      font-size: 15px;
      text-align: center;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--wc-fg);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--wc-bg);
      border: 1px solid var(--wc-line);
      border-radius: 10px;
      font-size: 15px;
      color: var(--wc-fg);
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: var(--wc-fg-dim);
    }

    input:focus { 
      border-color: var(--wc-brass);
      box-shadow: 0 0 0 1px var(--wc-brass);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: 1px solid var(--wc-brass);
      border-radius: 10px;
      background: var(--wc-brass);
      color: var(--wc-bg);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    button:hover { 
      background: var(--wc-brass-soft);
      border-color: var(--wc-brass-soft);
    }

    button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .error { 
      color: #B5553D; /* Destructive token */
      font-size: 13px; 
      margin-bottom: 16px; 
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="brand">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -10 180 180">
          <circle cx="98" cy="80" r="88" fill="#0F3B3A"/>
          <path fill="#d4a876" d="M65.12,55.23c9.62,6.57,15.51,10.5,24.56,23.66,4.73,6.88,7.1,10.79,8.13,12.7,1.03-1.91,3.4-5.82,8.13-12.7,9.05-13.15,14.94-17.09,24.56-23.66,5.97-4.08,10.53-9.21,12.11-16.49.34-1.58.4-3.22.67-5.49-15.25,10.88-30.38,16.27-45.46,16.24-15.08.04-30.22-5.36-45.46-16.24.27,2.28.32,3.92.67,5.49,1.58,7.28,6.14,12.41,12.11,16.49Z"/>
          <path fill="#d4a876" d="M46.9,97.97c-.29-1.24-.45-1.83-.56-2.44-1.99-10.94,2.43-21.55,11.01-26.85,2.62-1.62,4.95-2.14,7.69-.23,4.34,3.02,8.83,5.81,13.26,8.7-4.19-5.31-8.78-10.3-13.96-14.61-5.51-4.58-11.76-8.3-15.06-15.15-.35.22-.71.43-1.06.65,1.92,4.3,3.83,8.61,5.75,12.91-15.42,11.76-18.2,24.8-7.08,37.02Z"/>
          <path fill="#d4a876" d="M57.37,86.83c-1.68,4.69.16,9.75,4.28,12.41,4.31,2.78,10.03,2.2,13.69-1.38,3.77-3.67,4.42-9.54,1.55-13.95-2.88-4.43-7.77-5.98-12.02-4.44.32,2.3,1.54,4.89.72,6.34-1.88,3.34-5.25,2.62-8.22,1.01Z"/>
          <path fill="#d4a876" d="M103.75,116.31c-1.95,3.32-3.97,6.74-6.18,10.48-2.47-4.19-4.71-7.98-6.88-11.67,0,0,0,0,0-.01-.58-.99-1.17-1.98-1.75-2.97-24.01,18.02-50.75-.25-51.38-23.01,4.9,12.53,13.11,19.96,25.51,21.77,12.38,1.81,21.85-2.69,27.21-15.87l13.46,21.29Z"/>
          <path fill="#d4a876" d="M157.57,89.13c-.63,22.76-27.37,41.03-51.38,23.01-.41.69-.44.72-.85,1.41l-6.65-10.38c2.7-4.16,4.88-7.54,5.79-9.08,5.28,13.9,14.91,18.65,27.58,16.81,12.4-1.81,20.6-9.24,25.51-21.77Z"/>
          <path fill="#d4a876" d="M130.8,62.55c-5.17,4.31-9.77,9.3-13.96,14.61,4.43-2.89,8.92-5.68,13.26-8.7,2.74-1.91,5.07-1.39,7.69.23,8.58,5.29,13,15.91,11.01,26.85-.11.6-.27,1.2-.56,2.44,11.12-12.22,8.34-25.25-7.08-37.02,1.91-4.3,3.83-8.6,5.75-12.91-.35-.22-.71-.43-1.06-.65-3.3,6.85-9.55,10.57-15.06,15.15Z"/>
          <path fill="#d4a876" d="M118.26,83.91c-2.87,4.41-2.22,10.28,1.55,13.95,3.67,3.58,9.39,4.15,13.69,1.38,4.12-2.66,5.96-7.72,4.28-12.41-2.97,1.61-6.34,2.32-8.22-1.01-.82-1.45.4-4.04.72-6.34-4.25-1.54-9.14.01-12.02,4.44Z"/>
        </svg>
      </div>
      <h1>WisdomChat</h1>
      <div class="sub-brand">By GetSetAI</div>
    </div>
    
    <p class="subtitle">Experience proactive AI for e-commerce. Enter your details to connect with us on WhatsApp.</p>

    <form id="leadForm">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" placeholder="John Doe" required>
      </div>

      <div class="input-group">
        <label for="company">Company / Store Name</label>
        <input id="company" name="company" type="text" placeholder="Your brand name" required>
      </div>

      <div id="error" class="error"></div>
      
      <button type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
        </svg>
        Connect on WhatsApp
      </button>
    </form>
  </main>

  <script>
    const whatsappNumber = "919787605132";

    document.getElementById("leadForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const company = document.getElementById("company").value.trim();
      const error = document.getElementById("error");

      if (!name || !company) {
        error.textContent = "Please enter both your name and company name.";
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      const message = \`Hi GetSetAI Team! I am \${name} from \${company}. I'm interested in learning more about WisdomChat.\`;

      const whatsappUrl = \`https://wa.me/\${whatsappNumber}?text=\${encodeURIComponent(message)}\`;

      window.location.href = whatsappUrl;
    });
  </script>
</body>
</html>
